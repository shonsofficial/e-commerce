<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="checkoutLayout">
            <div class="returnCart">
                <a href="index.html" target="_blank">keep shopping🛒</a>
                <h1>List Product in Cart📃</h1>
                <div class="list">
                    <div class="item">
                        <img src="images/rollie1.jpeg">
                        <div class="info">
                            <div class="name">Product 5</div> <!--Previously PRODUCT 1, THEN rollie1-->
                            <div class="price">$120/1 product</div><!--Previously $22.1, then $5200-->
                        </div>
                        <div class="quantity">4</div> <!--Previously 5, then 1-->
                        <div class="returnPrice">$480</div> <!--Previously $50, then $5200-->
                    </div>
                </div>
            </div>
            <div class="right">
                <h1>Checkout</h1>
                <div class="form">
                    <div class="group">
                        <label for="name">Full Name</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <div class="group">
                        <label for="phone">Phone Number</label>
                        <input type="text" name="phone" id="phone">
                    </div>
                    <div class="group">
                        <label for="address">Address</label>
                        <input type="text" name="address" id="address">
                    </div>
                    <div class="group">
                        <label for="">Country</label>
                        <select name="Country" id="Country" aria-placeholder="Choose">
                            <option value="">India</option>
                            <option value="">UK</option>
                            <option value="">China</option>
                            <option value="">Korea</option>
                            <option value="">Japan</option>
                            <option value="">Nigeria</option>
                        </select>
                    </div>
                    <div class="group">
                        <label for="city">City</label>
                        <select name="city" id="city" aria-placeholder="Choose">
                            <option value="">New Dehli</option>
                            <option value="">London</option>
                            <option value="">Beijing</option>
                            <option value="">Seoul</option>
                            <option value="">Tokyo</option>
                            <option value="">Lagos</option>
                        </select>
                    </div>
                </div>
                <div class="return">
                    <div class="row">
                        <div>Total Quantity</div>
                        <div class="totalQuantity">70</div>
                    </div>
                    <div class="row">
                        <div>Total Price</div>
                        <div class="totalPrice">$900</div>
                    </div>
                </div>
                <button class="buttonCheckout">CHECKOUT</button>
            </div>
        </div>
    <script src="mycheckout.js"></script>
</body>
</html>
